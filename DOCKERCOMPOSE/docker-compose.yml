services:
  # Base de datos
  db:
    image: postgres:16-alpine
    container_name: conversor-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: divisas
    volumes:
      # Guarda los datos fuera del contenedor para que no se pierdan al borrarlo
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d divisas"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: conversor-api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: divisas
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: conversor-web
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  pgdata:
